services:
  app:
    container_name: recruitment-task-primeo-app
    build:
      context: .
      dockerfile_inline: |
        FROM php:8.4-cli-alpine
        COPY --from=ghcr.io/mlocati/php-extension-installer /usr/bin/install-php-extensions /usr/local/bin/
        COPY --from=composer:latest /usr/bin/composer /usr/bin/composer
        RUN apk add --no-cache git unzip \
            && install-php-extensions pdo_mysql zip bcmath
        WORKDIR /app
        COPY . .
        RUN composer install --no-interaction --no-progress
    command: >
      sh -c "php artisan migrate:fresh --seed --force
      && php artisan scribe:generate
      && php artisan serve --host=0.0.0.0 --port=8080"
    environment:
      APP_NAME: Employee Management
      APP_ENV: local
      APP_KEY: "base64:Ad2gbAK7fkpRX4HnDF2S5oB+st9nVeKxOoKEWyB6acw="
      APP_DEBUG: "true"
      APP_URL: http://localhost:8080
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: primeo
      DB_USERNAME: primeo
      DB_PASSWORD: primeo
    ports:
      - '8080:8080'
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    container_name: recruitment-task-primeo-db
    image: mysql:26.7
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: primeo
      MYSQL_USER: primeo
      MYSQL_PASSWORD: primeo
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql_data:
